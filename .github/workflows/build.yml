name: Build nRF52840 LSM6DSV UF2 Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Bootloader application flash start address:
  # - 0x26000 for SoftDevice S140 v6.1.1 (Adafruit bootloader 0.6.x and earlier)
  # - 0x27000 for SoftDevice S140 v7.x   (Adafruit bootloader 0.7.x and newer)
  # Check your board's INFO_UF2.TXT to confirm SoftDevice version!
  FLASH_OFFSET: "0x26000"
  BOARD_FQBN: "adafruit:nrf52:feather52840"

jobs:
  build:
    name: Compile Firmware and Finder UF2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install adafruit-nrfutil
          curl -sSL https://raw.githubusercontent.com/microsoft/uf2/master/utils/uf2conv.py -o uf2conv.py

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          sudo mv bin/arduino-cli /usr/local/bin/
          arduino-cli version

      - name: Configure Arduino CLI & Install Adafruit nRF52 Core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://adafruit.github.io/arduino-board-index/package_adafruit_index.json
          arduino-cli core update-index
          arduino-cli core install adafruit:nrf52

      - name: Compile Main Firmware (firmware.ino)
        run: |
          mkdir -p build/firmware_out
          arduino-cli compile \
            --fqbn ${{ env.BOARD_FQBN }} \
            --build-property "build.flags.usb=-DUSE_TINYUSB" \
            --output-dir build/firmware_out \
            firmware/firmware.ino

      - name: Compile Pinout Finder (imu_finder.ino)
        run: |
          mkdir -p build/finder_out
          arduino-cli compile \
            --fqbn ${{ env.BOARD_FQBN }} \
            --build-property "build.flags.usb=-DUSE_TINYUSB" \
            --output-dir build/finder_out \
            imu_finder/imu_finder.ino

      - name: Convert HEX to UF2
        run: |
          echo "Packaging UF2 files with Flash Offset ${{ env.FLASH_OFFSET }} and Family ID 0xADA52840..."
          python3 uf2conv.py build/firmware_out/firmware.ino.hex -c -b ${{ env.FLASH_OFFSET }} -f 0xADA52840 -o build/firmware.uf2
          python3 uf2conv.py build/finder_out/imu_finder.ino.hex -c -b ${{ env.FLASH_OFFSET }} -f 0xADA52840 -o build/imu_finder.uf2
          ls -la build/*.uf2

      - name: Upload UF2 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nrf52840-lsm6dsv-uf2-binaries
          path: |
            build/firmware.uf2
            build/imu_finder.uf2

      - name: Commit and push compiled UF2 files to repo
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build/firmware.uf2 build/imu_finder.uf2
          if ! git diff --staged --quiet; then
            git commit -m "ci: update compiled firmware.uf2 and imu_finder.uf2 [skip ci]"
            git push
          else
            echo "No changes in UF2 binaries to commit."
          fi
